<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Palette 1: Prugna / Corallo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#581c87"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <!-- Diagonal light sheen for depth -->
    <linearGradient id="sheen" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="48%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <text
      x="256"
      y="378"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="300"
      font-weight="700"
      fill="#f5ede0"
    >Æ</text>
  </g>
</svg>
